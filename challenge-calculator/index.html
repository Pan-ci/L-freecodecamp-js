<!doctype html>
<html>
    <head>
        <title>Calculator Challenge</title>
        <link rel="stylesheet" href="../stylesheet.css">
    </head>
    <body>
        <h1>Calculator Challenge</h1>
        <span id="num-el1" style="text-decoration: underline;"></span>
        <span id="num-el2" style="text-decoration: underline;"></span>
        <div>
            <button id="add-btn" onclick="add()" style="color: black;">Add</button>
        </div>
        <div>
            <button id="subtract-btn" onclick="subtract()" style="color: black;">Subtract</button>
        </div>
        <div>
            <button id="multiply-btn" onclick="multiply()" style="color: black;">Multiply</button>
        </div>
        <div>
            <button id="divide-btn" onclick="divide()" style="color: black;">Divide</button>
        </div>
        <div style="text-decoration: underline;" >
            <span>SUM: </span>
            <span id="sum-el"></span>
        </div>
        <script src="challenge-calculator.js"></script>
    </body>
</html>
