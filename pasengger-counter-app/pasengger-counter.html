<!doctype html>
<html>
    <head>
        <title>Pasengger Counter App</title>
        <link rel="stylesheet" href="pasengger-counter.css">
    </head>
    <body>
        <h1>People entered:</h1>
        <h2 id="count-el">0</h2>
        <div>
            <button id="increment-btn" onclick="increment()">INCREMENT</button>
        </div>
        <div>
            <button id="save-btn" onclick="save()">SAVE</button>
        </div>
        <p id="save-el">Previous entries: </p>
        <br>
        <div>
            <button id="purchase-btn" onclick="purchase()" style="color: black;">Purchase - $149</button>
        </div>
        <p id="error-el" style="color: red;"></p>
        <script src="pasengger-counter.js"></script>
    </body>
</html>
